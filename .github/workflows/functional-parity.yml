name: NeumuacFQ functional parity tracking
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-functional-parity.mjs
      - run: node --test supabase/functions/_shared/adminInvitationGateway.test.mjs
