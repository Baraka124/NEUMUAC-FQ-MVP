name: NeumuacFQ clinical foundation
on:
  pull_request:
    paths:
      - 'apps/clinical-web/**'
      - '.github/workflows/clinical-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/clinical-web/**'
      - '.github/workflows/clinical-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    name: Vue TypeScript / check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/clinical-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:migration
      - run: npm run test:differential
      - name: Publish differential report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cftr-search-differential
          path: apps/clinical-web/search-differential-report.json
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run test:release
      - run: npm run build
      - run: node scripts/check-built-release.mjs
      - name: Verify real-data-only source boundaries
        run: |
          if grep -RIE 'https?://[a-z0-9-]+\\.supabase\\.co|service_role.{0,25}(eyJ|sk_)' src --include='*.ts' --include='*.vue'; then
            echo 'Hardcoded Supabase endpoints or privileged credentials are forbidden.'
            exit 1
          fi
          if grep -E 'DEMO_RECORDS|DEMO-CFTR|syntheticVariantRepository|fixtures/' src/views/Variants.vue src/views/Overview.vue; then
            echo 'Running Vue workspaces cannot import or display synthetic variant records.'
            exit 1
          fi

  browser-smoke:
    name: Clinical browser / smoke
    # Playwright 1.56 Chromium is not installable on the ubuntu-26.04 runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/clinical-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clinical-browser-traces
          path: apps/clinical-web/test-results/
          retention-days: 7

  browser-contract:
    name: Connected five-therapy browser contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/clinical-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:contract
      - name: Upload contract failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: five-therapy-contract-traces
          path: apps/clinical-web/test-results/
          retention-days: 7
