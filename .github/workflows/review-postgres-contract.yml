name: NeumuacFQ staging PostgreSQL review contract
on:
  pull_request:
    paths:
      - 'staging/review/**'
      - '.github/workflows/review-postgres-contract.yml'
  push:
    branches: [main]
    paths:
      - 'staging/review/**'
      - '.github/workflows/review-postgres-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: review_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d review_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Run isolated disposable PostgreSQL test
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: disposable-test-only
          PGDATABASE: review_test
        run: psql -X -v ON_ERROR_STOP=1 -f staging/review/002_disposable_ci_contract.sql
      - name: Verify competing reviewers serialize atomically
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: disposable-test-only
          PGDATABASE: review_test
        run: bash staging/review/003_concurrent_review_contract.sh
      - name: Verify session revocation and transaction-local actor isolation
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: disposable-test-only
          PGDATABASE: review_test
        run: psql -X -v ON_ERROR_STOP=1 -f staging/review/004_private_session_contract.sql
      - name: Verify dedicated transport remains least-privileged across transactions
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: disposable-test-only
          PGDATABASE: review_test
        run: psql -X -v ON_ERROR_STOP=1 -f staging/review/005_transport_role_contract.sql
      - name: Provision disposable least-privilege HTTP test identity
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: disposable-test-only
          PGDATABASE: review_test
        run: psql -X -v ON_ERROR_STOP=1 -f staging/review/006_queue_http_fixture.sql
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache pinned PostgreSQL adapter only inside CI
        run: deno cache staging/review/006_private_queue_http_contract.mjs
      - name: Verify private queue over real loopback HTTP and PostgreSQL
        env:
          PGHOST: '127.0.0.1'
          PGPORT: '5432'
          PGDATABASE: review_test
        run: deno run --allow-net=127.0.0.1 --allow-env staging/review/006_private_queue_http_contract.mjs

