name: neumuacFQ revoked membership proposal visibility
on:
  pull_request:
    paths:
      - 'supabase/proposed/14h111_active_membership_proposal_read.sql'
      - 'staging/review/010_active_membership_proposal_contract.sql'
      - '.github/workflows/revoked-proposal-visibility.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/proposed/14h111_active_membership_proposal_read.sql'
      - 'staging/review/010_active_membership_proposal_contract.sql'
      - '.github/workflows/revoked-proposal-visibility.yml'
permissions:
  contents: read
jobs:
  isolated-review-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: revocation_contract
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d revocation_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Verify scoped reads, revocation, reviewers and audit isolation
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: disposable-only
          PGDATABASE: revocation_contract
        run: psql -X -v ON_ERROR_STOP=1 -f staging/review/010_active_membership_proposal_contract.sql
