name: Publish modern NeumuacFQ to GitHub Pages root
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-vue-cutover.yml'
      - 'apps/clinical-web/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: neumuacfq-root-cutover
  cancel-in-progress: false
jobs:
  cutover:
    if: github.repository == 'Baraka124/NEUMUAC-FQ-MVP'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and verify modern application
        working-directory: apps/clinical-web
        env:
          VITE_NFQ_READ_ONLY_ENABLED: 'true'
          VITE_NFQ_READ_ACCESS_MODE: anonymous
          VITE_NFQ_VARIANT_SOURCE: variants
          VITE_NFQ_SUPABASE_URL: https://oxlkisjwfarseyqgeyuw.supabase.co
          VITE_NFQ_SUPABASE_PUBLISHABLE_KEY: sb_publishable_vKCe5bc1Qr20_LI_awKIYw_CqSFrblh
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run test:differential
          npm run build
      - name: Preserve verified legacy site and prepare root
        shell: bash
        run: |
          set -euo pipefail
          test -s CNAME
          test -s apps/clinical-web/dist/index.html
          test -d apps/clinical-web/dist/assets
          test -s apps/clinical-web/dist/brand/neumuacfq-icon.png
          test -s apps/clinical-web/dist/brand/neumuacfq-logo.png
          cmp apps/clinical-web/public/brand/neumuacfq-icon.png apps/clinical-web/dist/brand/neumuacfq-icon.png
          cmp apps/clinical-web/public/brand/neumuacfq-logo.png apps/clinical-web/dist/brand/neumuacfq-logo.png
          if [[ ! -f index.1.html ]]; then
            cp index.html index.1.html
          fi
          test "$(git hash-object index.1.html)" = "c18221fb6baf47782318ca3685b94b088c359a66"
          cp apps/clinical-web/dist/index.html index.html
          mkdir -p assets
          rm -rf assets
          cp -R apps/clinical-web/dist/assets assets
          mkdir -p brand
          cp apps/clinical-web/dist/brand/neumuacfq-icon.png brand/neumuacfq-icon.png
          cp apps/clinical-web/dist/brand/neumuacfq-logo.png brand/neumuacfq-logo.png
          cmp apps/clinical-web/public/brand/neumuacfq-icon.png brand/neumuacfq-icon.png
          cmp apps/clinical-web/public/brand/neumuacfq-logo.png brand/neumuacfq-logo.png
          touch .nojekyll
          node tools/phase0b-baseline.mjs
          node --test tools/phase0b-baseline.test.mjs
          python tools/security_release_gate.py
          python tools/legacy_endpoint_inventory.py --source index.1.html --output /tmp/phase-2lc-inventory.md
      - name: Commit compiled root and frozen original
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index.1.html .nojekyll assets/ brand/neumuacfq-icon.png brand/neumuacfq-logo.png
          if ! git diff --cached --quiet; then
            git commit -m "Deploy Vue clinical-web at root, preserve verified legacy index.1.html"
            git push origin HEAD:main
          fi
