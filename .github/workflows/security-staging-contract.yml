name: NeumuacFQ security staging contract
on:
  pull_request:
    paths:
      - 'staging/security/**'
      - '.github/workflows/security-staging-contract.yml'
  push:
    branches: [main]
    paths:
      - 'staging/security/**'
      - '.github/workflows/security-staging-contract.yml'
permissions:
  contents: read
jobs:
  pg-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: security_staging
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d security_staging"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Exercise synthetic security baseline and proposed lockdown
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: local-only
          PGDATABASE: security_staging
        run: psql -X -v ON_ERROR_STOP=1 -f staging/security/030_security_contract.sql
