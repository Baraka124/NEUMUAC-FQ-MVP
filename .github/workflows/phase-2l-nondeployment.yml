name: Phase 2L non-deployment guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-security-release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify staging SQL cannot silently become production migrations
        run: python tools/security_release_gate.py
